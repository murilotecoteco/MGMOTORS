name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:a11y
      - run: npm run test:e2e -- --workers=1
      - run: git diff --check HEAD~1 HEAD
