<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../imagens/logo-mg.png">
  <link rel="shortcut icon" href="../imagens/logo-mg.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MG Motors | Acesse sua Conta</title>
<meta name="description" content="Acesse sua conta na MG Motors para gerenciar anúncios, mensagens e favoritos no marketplace premium de veículos.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Login - MG Motors">
<meta property="og:description" content="Entre na sua conta MG Motors e acesse o marketplace premium de veículos.">
<meta property="og:image" content="https://mgmotorss.vercel.app/imagens/logo-mg.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="login.css">
<link rel="canonical" href="https://mgmotorss.vercel.app/MG-LOGIN/login.html">
</head>
<body>
<main class="auth-shell">
  <form id="form-login" class="auth-card">
    <div class="auth-brand">
      <span>MG Motors</span>
      <small>Marketplace premium de veiculos</small>
    </div>

    <div class="header-form">
      <button type="button" id="back-arrow" aria-label="Voltar para o inicio">&larr;</button>
      <h1>Entrar</h1>
    </div>

    <p class="auth-subtitle">Acesse sua conta para anunciar, negociar e acompanhar seus veiculos favoritos.</p>

    <label for="email-login">E-mail</label>
    <input type="email" id="email-login" placeholder="seuemail@exemplo.com" autocomplete="email" required>

    <label for="senha-login">Senha</label>
    <input type="password" id="senha-login" placeholder="Digite sua senha" autocomplete="current-password" required>
    <p style="text-align:right;margin-top:-8px;margin-bottom:4px;">
      <a href="recuperar-senha.html" style="font-size:13px;color:#144b71;text-decoration:none;opacity:.75;">Esqueci minha senha</a>
    </p>

    <fieldset class="consentimentos" aria-describedby="consentimentos-ajuda">
      <legend>Documentos legais</legend>
      <p id="consentimentos-ajuda">Para entrar, confirme que leu os documentos vigentes (versão 2.0).</p>
      <label class="consentimento" for="aceite-termos">
        <input type="checkbox" id="aceite-termos" required>
        <span>Li e aceito os <a href="../MG-LEGAL/termos.html" target="_blank" rel="noopener">Termos de Uso</a>.</span>
      </label>
      <label class="consentimento" for="aceite-privacidade">
        <input type="checkbox" id="aceite-privacidade" required>
        <span>Li e concordo com a <a href="../MG-LEGAL/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</span>
      </label>
    </fieldset>

    <p id="form-feedback" class="form-feedback" role="status" aria-live="polite"></p>

    <button type="submit" class="primary-action">Entrar</button>
    <button type="button" id="botao-google-login" class="google"><span>G</span> Entrar com Google</button>

    <p class="auth-switch">Nao tenho uma conta - <a href="register.html">Criar conta</a></p>
  </form>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.117.3";
import { supabaseUrl, supabaseKey } from "../mgConfig.js";
import { consentimentoAtual, registrarAceiteLegal } from "../legalConsent.js";
const supa = createClient(supabaseUrl, supabaseKey);
const feedback = document.getElementById("form-feedback");
const aceiteTermos = document.getElementById("aceite-termos");
const aceitePrivacidade = document.getElementById("aceite-privacidade");
const botaoEntrar = document.querySelector('#form-login button[type="submit"]');

function aceitesCompletos() {
  return aceiteTermos.checked && aceitePrivacidade.checked;
}
function atualizarEstadoLogin() {
  botaoEntrar.disabled = !aceitesCompletos();
}
atualizarEstadoLogin();
aceiteTermos.addEventListener("change", atualizarEstadoLogin);
aceitePrivacidade.addEventListener("change", atualizarEstadoLogin);

function mostrarFeedback(mensagem, tipo = "erro") {
  feedback.textContent = mensagem;
  feedback.dataset.tipo = tipo;
}

// Exibe mensagem de suspensão quando redirecionado pelo headerGlobal
// (sessão ativa banida, login via Google com conta banida, etc.)
const _params = new URLSearchParams(window.location.search);
if (_params.get("banido") === "1") {
  mostrarFeedback("Sua conta está suspensa. Entre em contato com o suporte se acreditar que isso é um erro.");
}

let loginEmEnvio = false; // o submit registra o aceite e faz o redirect sozinho
supa.auth.onAuthStateChange(async (event, session) => {
  if (event === "SIGNED_IN" && session && !loginEmEnvio) {
    // A1: Verifica banimento ANTES de redirecionar — cobre login via Google OAuth
    const { data: perfil } = await supa.from("usuarios").select("banido").eq("id", session.user.id).maybeSingle();
    if (perfil?.banido) {
      await supa.auth.signOut();
      mostrarFeedback("Sua conta está suspensa. Entre em contato com o suporte se acredita que isso é um erro.");
      return;
    }
    window.location.href = "../MG-CONTA/conta.html";
  }
});

document.getElementById("back-arrow").addEventListener("click", () => {
  window.location.href = "../MG-INICIO/inicio.html";
});

document.getElementById("form-login").addEventListener("submit", async e => {
  e.preventDefault();
  const botao = e.target.querySelector('button[type="submit"]');
  const email = document.getElementById("email-login").value.trim();
  const senha = document.getElementById("senha-login").value;

  if (!aceitesCompletos()) {
    mostrarFeedback("Você precisa aceitar os Termos de Uso e a Política de Privacidade para entrar.");
    atualizarEstadoLogin();
    return;
  }

  loginEmEnvio = true;
  botao.disabled = true;
  botao.textContent = "Entrando...";
  mostrarFeedback("");

  const { data, error } = await supa.auth.signInWithPassword({ email, password: senha });
  if (error) {
    loginEmEnvio = false;
    mostrarFeedback("Nao foi possivel entrar. Verifique e-mail e senha.");
    botao.disabled = false;
    botao.textContent = "Entrar";
    return;
  }

  if (data?.user) {
    // Melhoria 1: maybeSingle() — recém-cadastrado pode ainda não ter linha em `usuarios`.
    const { data: perfil } = await supa.from("usuarios")
      .select("banido, nome, terms_accepted_at, privacy_accepted_at, terms_version, privacy_version")
      .eq("id", data.user.id).maybeSingle();
    if (perfil?.banido) {
      await supa.auth.signOut();
      loginEmEnvio = false;
      mostrarFeedback("Sua conta esta suspensa. Entre em contato com o suporte se acredita que isso e um erro.");
      botao.disabled = false;
      botao.textContent = "Entrar";
      return;
    }
    // Registra o aceite da versão vigente (nova conta ou termos atualizados).
    if (!consentimentoAtual(perfil)) {
      const { error: aceiteError } = await registrarAceiteLegal(supa);
      if (aceiteError) {
        await supa.auth.signOut();
        loginEmEnvio = false;
        mostrarFeedback("Não foi possível registrar seu aceite. Tente novamente.");
        botao.disabled = false;
        botao.textContent = "Entrar";
        return;
      }
    }
  }

  mostrarFeedback("Login realizado. Redirecionando...", "sucesso");
  window.location.href = "../MG-CONTA/conta.html";
});

document.getElementById("botao-google-login").addEventListener("click", async () => {
  const botao = document.getElementById("botao-google-login");
  if (!aceitesCompletos()) {
    mostrarFeedback("Aceite os Termos de Uso e a Política de Privacidade antes de continuar.");
    return;
  }
  sessionStorage.setItem("mg_legal_oauth_pending", "1");
  botao.disabled = true;
  mostrarFeedback("Abrindo o login do Google...", "sucesso");
  // A home é o Site URL oficial do projeto e está na allow list do Supabase.
  // Depois do retorno, o headerGlobal lê a sessão persistida e atualiza o perfil.
  const redirectTo = new URL("/MG-INICIO/inicio.html", window.location.origin).href;
  const { error } = await supa.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo }
  });
  if (error) {
    botao.disabled = false;
    sessionStorage.removeItem("mg_legal_oauth_pending");
    mostrarFeedback("Não foi possível iniciar o login com Google. Confira a configuração OAuth no Supabase.");
    console.error("Google OAuth error:", error);
  }
});
</script>
<style>#chtl-chat-icon-container{left:auto!important;right:20px!important;width:auto!important;}</style>
<script type="module" src="/chatlingConsent.js?v=20261113"></script>
</body>
</html>
